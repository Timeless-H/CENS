[project]
name = "cens"
description = "CENS: Nerfacto with uniform grid sampling, as a nerfstudio method plugin."
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["nerfstudio>=1.1.5"]

[tool.setuptools.packages.find]
include = ["cens*"]

[project.entry-points.'nerfstudio.method_configs']
cens = 'cens.cens_config:cens'

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
